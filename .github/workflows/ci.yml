name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.2 / MariaDB / Bus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Ephemeral CI database only; no repository secrets are required.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ''
      BUS_DB_NAME: bus_meta
      ALPHA_DB_NAME: market_alpha
      BETA_DB_NAME: market_beta
      GAMMA_DB_NAME: market_gamma
      BUS_HOST: 127.0.0.1
      BUS_PORT: '8000'
      PROVIDER_ALPHA_URL: http://127.0.0.1:8101
      PROVIDER_BETA_URL: http://127.0.0.1:8102
      PROVIDER_GAMMA_URL: http://127.0.0.1:8103
      SEARCH_TTL_SECONDS: '3'
      CLEANUP_INTERVAL_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: PHP and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, fileinfo, mbstring
          coverage: xdebug
          tools: composer:v2
      - name: Install testing dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find apps services shared scripts tests -name '*.php' -print0 | xargs -0 -n 1 php -l && php -l bootstrap.php
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install schemas, tables, demo data and migration
        run: php scripts/prepare-database.php
      - name: Existing unit tests
        run: php tests/run.php
      - name: PHPUnit with real unit coverage
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage
      - name: Preserve PHPUnit and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: |
            coverage/
            test-results/phpunit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Complete installation and safe reimport
        run: php tests/verify-installation.php
      - name: Portable Bus and testing forms tests
        run: php tests/smoke-bus.php
      - name: Java for JMeter
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Download verified Apache JMeter 5.6.3
        env:
          JMETER_VERSION: '5.6.3'
          JMETER_SHA512: 5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083
        run: |
          archive="apache-jmeter-${JMETER_VERSION}.tgz"
          curl --fail --show-error --location --retry 3 \
            "https://dlcdn.apache.org/jmeter/binaries/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$JMETER_SHA512" "${RUNNER_TEMP}/${archive}" | sha512sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP"
      - name: Test JMeter result validation
        run: python3 -m unittest discover -s tests/jmeter -p 'test_*.py' -v
      - name: Real JMeter run and sample validation
        run: python3 tests/jmeter/run_ci.py --jmeter "$RUNNER_TEMP/apache-jmeter-5.6.3/bin/jmeter"
      - name: Preserve JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: .runtime/jmeter/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
